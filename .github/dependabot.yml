version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than one per package.
      gulp:
        patterns: ['gulp', 'gulp-*']
      tooling:
        patterns: ['esbuild', 'sharp', 'stylelint*', 'prettier', 'browserslist*']
      postcss:
        patterns: ['postcss', 'postcss-*', 'autoprefixer', 'cssnano', 'sass']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
